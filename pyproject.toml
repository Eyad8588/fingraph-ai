[project]
name = "fingraph-ai"
version = "0.1.0"
description = "FinGraph AI: financial intelligence workspace (RAG + knowledge graph + metrics) on local or cloud LLMs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "numpy>=1.26",
    "pypdfium2>=4.30",
    "python-docx>=1.1",
    "pillow>=10",
    "ocrmac>=1.0; sys_platform == 'darwin'",
    "sqlite-vec>=0.1.9",
    "fastembed>=0.9.1",
]

[dependency-groups]
dev = ["pytest>=8", "reportlab>=4"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
